  - "target": "$.paths['/offers/price-estimate'].post"
    "description": "Request samples for estimateOfferPrice."
    "update":
      "x-codeSamples":
        - "lang": "Shell"
          "label": "cURL"
          "source": "curl -X POST \"https://ads.agilis.dating/offers/price-estimate\" \\\n  -H \"x-api-key: YOUR_API_KEY_HERE\" \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\n    \"start_datetime\": \"2027-07-10T08:00:00Z\",\n    \"end_datetime\": \"2027-07-12T20:30:00Z\",\n    \"location\": [51.5074, -0.1278],\n    \"radius\": 10,\n    \"gender\": [\"Male\", \"Female\"],\n    \"interests\": [3, 7]\n  }'"
        - "lang": "TypeScript"
          "label": "Node.js"
          "source": "import { Agilis } from '@agilisdating/ads';\n\nconst client = new Agilis(); // reads AGILIS_API_KEY\n\nconst result = await client.offers.estimatePrice({\n  start_datetime: '2027-07-10T08:00:00Z',\n  end_datetime: '2027-07-12T20:30:00Z',\n  location: [51.5074, -0.1278],\n  radius: 10,\n  gender: ['Male', 'Female'],\n  interests: [3, 7],\n});\nconsole.log(result.estimated_cost);"
        - "lang": "Python"
          "label": "Python"
          "source": "from agilis_ads import Agilis\n\nclient = Agilis()  # reads AGILIS_API_KEY\n\nresult = client.offers.estimate_price({\n    \"start_datetime\": \"2027-07-10T08:00:00Z\",\n    \"end_datetime\": \"2027-07-12T20:30:00Z\",\n    \"location\": [51.5074, -0.1278],\n    \"radius\": 10,\n    \"gender\": [\"Male\", \"Female\"],\n    \"interests\": [3, 7],\n})\nprint(result[\"estimated_cost\"])"
        - "lang": "PHP"
          "label": "PHP"
          "source": "<?php\n\nrequire 'vendor/autoload.php';\n\nuse Agilis\\Ads\\AgilisClient;\n\n$agilis = new AgilisClient(); // reads AGILIS_API_KEY\n\n$result = $agilis->offers->estimatePrice([\n    'start_datetime' => '2027-07-10T08:00:00Z',\n    'end_datetime' => '2027-07-12T20:30:00Z',\n    'location' => [51.5074, -0.1278],\n    'radius' => 10,\n    'gender' => ['Male', 'Female'],\n    'interests' => [3, 7],\n]);\necho $result['estimated_cost'], \"\\n\";"
        - "lang": "C#"
          "label": ".NET"
          "source": "using Agilis.Ads;\n\nusing var client = new AgilisClient(); // reads AGILIS_API_KEY\n\nvar result = await client.Offers.EstimatePriceAsync(new OfferPriceEstimateParams\n{\n    StartDatetime = DateTimeOffset.Parse(\"2027-07-10T08:00:00Z\"),\n    EndDatetime = DateTimeOffset.Parse(\"2027-07-12T20:30:00Z\"),\n    Location = new GeoLocation(51.5074, -0.1278),\n    Radius = 10,\n    Gender = new[] { \"Male\", \"Female\" },\n    Interests = new[] { 3, 7 },\n});\nConsole.WriteLine(result.EstimatedCost);"
        - "lang": "Java"
          "label": "Java"
          "source": "import dating.agilis.ads.AgilisClient;\nimport dating.agilis.ads.param.EstimateOfferPriceParams;\n\nAgilisClient client = AgilisClient.builder().build(); // reads AGILIS_API_KEY\n\nvar result = client.offers().estimatePrice(\n    EstimateOfferPriceParams.builder()\n        .startDatetime(\"2027-07-10T08:00:00Z\")\n        .endDatetime(\"2027-07-12T20:30:00Z\")\n        .location(51.5074, -0.1278)\n        .radius(10)\n        .gender(\"Male\", \"Female\")\n        .interests(3, 7)\n        .build());\nSystem.out.println(result.getEstimatedCost());"
        - "lang": "Go"
          "label": "Go"
          "source": "package main\n\nimport (\n\t\"context\"\n\t\"fmt\"\n\t\"log\"\n\n\tagilisads \"github.com/agilisdating/agilis-ads-go\"\n)\n\nfunc main() {\n\tclient := agilisads.NewClient(\"\") // reads AGILIS_API_KEY\n\tctx := context.Background()\n\n\tresult, err := client.Offers.EstimatePrice(ctx, &agilisads.EstimateOfferPriceParams{\n\t\tStartDatetime: \"2027-07-10T08:00:00Z\",\n\t\tEndDatetime:   \"2027-07-12T20:30:00Z\",\n\t\tLocation:      agilisads.LatLng{Latitude: 51.5074, Longitude: -0.1278},\n\t\tRadius:        10,\n\t\tGender:        []string{\"Male\", \"Female\"},\n\t\tInterests:     []int64{3, 7},\n\t})\n\tif err != nil {\n\t\tlog.Fatal(err)\n\t}\n\tfmt.Println(result.EstimatedCost)\n}"
        - "lang": "Ruby"
          "label": "Ruby"
          "source": "require \"agilis_ads\"\n\nclient = AgilisAds::Client.new # reads AGILIS_API_KEY\n\nresult = client.offers.estimate_price(\n  start_datetime: \"2027-07-10T08:00:00Z\",\n  end_datetime: \"2027-07-12T20:30:00Z\",\n  location: [51.5074, -0.1278],\n  radius: 10,\n  gender: [\"Male\", \"Female\"],\n  interests: [3, 7]\n)\nputs result.estimated_cost"
  - "target": "$.paths['/offers'].post"
    "description": "Request samples for createOffer."
    "update":
      "x-codeSamples":
        - "lang": "Shell"
          "label": "cURL"
          "source": "curl -X POST \"https://ads.agilis.dating/offers\" \\\n  -H \"x-api-key: YOUR_API_KEY_HERE\" \\\n  -H \"Idempotency-Key: 3f1a9c7e-1b2d-4f9a-8c0e-2a6b5d4e7f10\" \\\n  -F \"category_id=1\" \\\n  -F \"title=20% off summer sale\" \\\n  -F \"description=Discount valid through July\" \\\n  -F \"terms_and_conditions=Valid online only.\" \\\n  -F \"push_notification_title=20% off this summer\" \\\n  -F \"push_notification_message=Show this at the till for 20% off everything until the end of July.\" \\\n  -F \"button_preset=book_now\" \\\n  -F \"url=https://advertiseroffer.com\" \\\n  -F \"location[]=51.5074\" \\\n  -F \"location[]=-0.1278\" \\\n  -F \"radius=10\" \\\n  -F \"gender[]=Male\" \\\n  -F \"gender[]=Female\" \\\n  -F \"interests[]=3\" \\\n  -F \"interests[]=7\" \\\n  -F \"start_datetime=2027-07-10T08:00:00Z\" \\\n  -F \"expiry_datetime=2027-07-12T20:30:00Z\" \\\n  -F \"payment_method=E\" \\\n  -F \"environment=LIVE\" \\\n  -F \"image=@/path/to/offer.jpg\""
        - "lang": "TypeScript"
          "label": "Node.js"
          "source": "import { Agilis } from '@agilisdating/ads';\n\nconst client = new Agilis(); // reads AGILIS_API_KEY\n\n// An Idempotency-Key is sent for you, and reused if the request is retried.\nconst result = await client.offers.create({\n  category_id: 1,\n  title: '20% off summer sale',\n  description: 'Discount valid through July',\n  terms_and_conditions: 'Valid online only.',\n  push_notification_title: '20% off this summer',\n  push_notification_message: 'Show this at the till for 20% off everything until the end of July.',\n  button_preset: 'book_now',\n  url: 'https://advertiseroffer.com',\n  location: [51.5074, -0.1278],\n  radius: 10,\n  gender: ['Male', 'Female'],\n  interests: [3, 7],\n  start_datetime: '2027-07-10T08:00:00Z',\n  expiry_datetime: '2027-07-12T20:30:00Z',\n  payment_method: 'E',\n  image: '/path/to/offer.jpg',\n});\nconsole.log(result.offer_id);"
        - "lang": "Python"
          "label": "Python"
          "source": "from agilis_ads import Agilis\n\nclient = Agilis()  # reads AGILIS_API_KEY\n\n# An Idempotency-Key is sent for you, and reused if the request is retried.\nresult = client.offers.create({\n    \"category_id\": 1,\n    \"title\": \"20% off summer sale\",\n    \"description\": \"Discount valid through July\",\n    \"terms_and_conditions\": \"Valid online only.\",\n    \"push_notification_title\": \"20% off this summer\",\n    \"push_notification_message\": \"Show this at the till for 20% off everything until the end of July.\",\n    \"button_preset\": \"book_now\",\n    \"url\": \"https://advertiseroffer.com\",\n    \"location\": [51.5074, -0.1278],\n    \"radius\": 10,\n    \"gender\": [\"Male\", \"Female\"],\n    \"interests\": [3, 7],\n    \"start_datetime\": \"2027-07-10T08:00:00Z\",\n    \"expiry_datetime\": \"2027-07-12T20:30:00Z\",\n    \"payment_method\": \"E\",\n    \"image\": \"/path/to/offer.jpg\",\n})\nprint(result[\"offer_id\"])"
        - "lang": "PHP"
          "label": "PHP"
          "source": "<?php\n\nrequire 'vendor/autoload.php';\n\nuse Agilis\\Ads\\AgilisClient;\n\n$agilis = new AgilisClient(); // reads AGILIS_API_KEY\n\n// An Idempotency-Key is sent for you, and reused if the request is retried.\n$result = $agilis->offers->create([\n    'category_id' => 1,\n    'title' => '20% off summer sale',\n    'description' => 'Discount valid through July',\n    'terms_and_conditions' => 'Valid online only.',\n    'push_notification_title' => '20% off this summer',\n    'push_notification_message' => 'Show this at the till for 20% off everything until the end of July.',\n    'button_preset' => 'book_now',\n    'url' => 'https://advertiseroffer.com',\n    'location' => [51.5074, -0.1278],\n    'radius' => 10,\n    'gender' => ['Male', 'Female'],\n    'interests' => [3, 7],\n    'start_datetime' => '2027-07-10T08:00:00Z',\n    'expiry_datetime' => '2027-07-12T20:30:00Z',\n    'payment_method' => 'E',\n    'image' => '/path/to/offer.jpg',\n]);\necho $result['offer_id'], \"\\n\";"
        - "lang": "C#"
          "label": ".NET"
          "source": "using Agilis.Ads;\n\nusing var client = new AgilisClient(); // reads AGILIS_API_KEY\n\n// An Idempotency-Key is sent for you, and reused if the request is retried.\nvar result = await client.Offers.CreateAsync(new OfferCreateParams\n{\n    CategoryId = 1,\n    Title = \"20% off summer sale\",\n    Description = \"Discount valid through July\",\n    TermsAndConditions = \"Valid online only.\",\n    PushNotificationTitle = \"20% off this summer\",\n    PushNotificationMessage = \"Show this at the till for 20% off everything until the end of July.\",\n    ButtonPreset = \"book_now\",\n    Url = \"https://advertiseroffer.com\",\n    Location = new GeoLocation(51.5074, -0.1278),\n    Radius = 10,\n    Gender = new[] { \"Male\", \"Female\" },\n    Interests = new[] { 3, 7 },\n    StartDatetime = DateTimeOffset.Parse(\"2027-07-10T08:00:00Z\"),\n    ExpiryDatetime = DateTimeOffset.Parse(\"2027-07-12T20:30:00Z\"),\n    PaymentMethod = \"E\",\n    Image = FileUpload.FromPath(\"/path/to/offer.jpg\"),\n});\nConsole.WriteLine(result.OfferId);"
        - "lang": "Java"
          "label": "Java"
          "source": "import dating.agilis.ads.AgilisClient;\nimport dating.agilis.ads.param.CreateOfferParams;\nimport java.nio.file.Path;\n\nAgilisClient client = AgilisClient.builder().build(); // reads AGILIS_API_KEY\n\n// An Idempotency-Key is sent for you, and reused if the request is retried.\nvar result = client.offers().create(\n    CreateOfferParams.builder()\n        .categoryId(1)\n        .title(\"20% off summer sale\")\n        .description(\"Discount valid through July\")\n        .termsAndConditions(\"Valid online only.\")\n        .pushNotificationTitle(\"20% off this summer\")\n        .pushNotificationMessage(\"Show this at the till for 20% off everything until the end of July.\")\n        .buttonPreset(\"book_now\")\n        .url(\"https://advertiseroffer.com\")\n        .location(51.5074, -0.1278)\n        .radius(10)\n        .gender(\"Male\", \"Female\")\n        .interests(3, 7)\n        .startDatetime(\"2027-07-10T08:00:00Z\")\n        .expiryDatetime(\"2027-07-12T20:30:00Z\")\n        .paymentMethod(\"E\")\n        .image(Path.of(\"/path/to/offer.jpg\"))\n        .build());\nSystem.out.println(result.getOfferId());"
        - "lang": "Go"
          "label": "Go"
          "source": "package main\n\nimport (\n\t\"context\"\n\t\"fmt\"\n\t\"log\"\n\n\tagilisads \"github.com/agilisdating/agilis-ads-go\"\n)\n\nfunc main() {\n\tclient := agilisads.NewClient(\"\") // reads AGILIS_API_KEY\n\tctx := context.Background()\n\n\t// An Idempotency-Key is sent for you, and reused if the request is retried.\n\tresult, err := client.Offers.Create(ctx, &agilisads.CreateOfferParams{\n\t\tCategoryID:              1,\n\t\tTitle:                   \"20% off summer sale\",\n\t\tDescription:             \"Discount valid through July\",\n\t\tTermsAndConditions:      agilisads.String(\"Valid online only.\"),\n\t\tPushNotificationTitle:   \"20% off this summer\",\n\t\tPushNotificationMessage: \"Show this at the till for 20% off everything until the end of July.\",\n\t\tButtonPreset:            \"book_now\",\n\t\tURL:                     \"https://advertiseroffer.com\",\n\t\tLocation:                agilisads.LatLng{Latitude: 51.5074, Longitude: -0.1278},\n\t\tRadius:                  10,\n\t\tGender:                  []string{\"Male\", \"Female\"},\n\t\tInterests:               []int64{3, 7},\n\t\tStartDatetime:           \"2027-07-10T08:00:00Z\",\n\t\tExpiryDatetime:          \"2027-07-12T20:30:00Z\",\n\t\tPaymentMethod:           \"E\",\n\t\tImage:                   agilisads.FileFromPath(\"/path/to/offer.jpg\"),\n\t})\n\tif err != nil {\n\t\tlog.Fatal(err)\n\t}\n\tfmt.Println(result.OfferID)\n}"
        - "lang": "Ruby"
          "label": "Ruby"
          "source": "require \"agilis_ads\"\n\nclient = AgilisAds::Client.new # reads AGILIS_API_KEY\n\n# An Idempotency-Key is sent for you, and reused if the request is retried.\nresult = client.offers.create(\n  category_id: 1,\n  title: \"20% off summer sale\",\n  description: \"Discount valid through July\",\n  terms_and_conditions: \"Valid online only.\",\n  push_notification_title: \"20% off this summer\",\n  push_notification_message: \"Show this at the till for 20% off everything until the end of July.\",\n  button_preset: \"book_now\",\n  url: \"https://advertiseroffer.com\",\n  location: [51.5074, -0.1278],\n  radius: 10,\n  gender: [\"Male\", \"Female\"],\n  interests: [3, 7],\n  start_datetime: \"2027-07-10T08:00:00Z\",\n  expiry_datetime: \"2027-07-12T20:30:00Z\",\n  payment_method: \"E\",\n  image: \"/path/to/offer.jpg\"\n)\nputs result.offer_id"
