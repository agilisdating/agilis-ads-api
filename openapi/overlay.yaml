"overlay": "1.0.0"
"info":
  "title": "Agilis Advertising API: presentation"
  "version": "1.0.0"
"extends": "https://www.agilis.dating/openapi.json"
"actions":
  - "target": "$.info"
    "description": "The Agilis logo."
    "update":
      "x-logo":
        "url": "https://www.agilis.dating/assets/img/logo.png"
        "altText": "Agilis"
        "href": "https://www.agilis.dating/api-doc"
  - "target": "$"
    "description": "Tag groups for the navigation."
    "update":
      "x-tagGroups":
        - "name": "Advertising"
          "tags":
            - "Offers"
            - "Events"
        - "name": "Integrations"
          "tags":
            - "Webhooks"
  - "target": "$.paths['/categories'].get"
    "description": "Request samples for listCategories."
    "update":
      "x-codeSamples":
        - "lang": "Shell"
          "label": "cURL"
          "source": "curl -X GET \"https://ads.agilis.dating/categories\" \\\n  -H \"x-api-key: YOUR_API_KEY_HERE\""
        - "lang": "TypeScript"
          "label": "Node.js"
          "source": "import { Agilis } from '@agilisdating/ads';\n\nconst client = new Agilis(); // reads AGILIS_API_KEY\n\nconst result = await client.categories.list();\nconsole.log(result.categories?.length);"
        - "lang": "Python"
          "label": "Python"
          "source": "from agilis_ads import Agilis\n\nclient = Agilis()  # reads AGILIS_API_KEY\n\nresult = client.categories.list()\nprint(len(result[\"categories\"]))"
        - "lang": "PHP"
          "label": "PHP"
          "source": "<?php\n\nrequire 'vendor/autoload.php';\n\nuse Agilis\\Ads\\AgilisClient;\n\n$agilis = new AgilisClient(); // reads AGILIS_API_KEY\n\n$result = $agilis->categories->list();\necho count($result['categories']), \"\\n\";"
        - "lang": "C#"
          "label": ".NET"
          "source": "using Agilis.Ads;\n\nusing var client = new AgilisClient(); // reads AGILIS_API_KEY\n\nvar result = await client.Categories.ListAsync();\nConsole.WriteLine(result.Categories.Count);"
        - "lang": "Java"
          "label": "Java"
          "source": "import dating.agilis.ads.AgilisClient;\n\nAgilisClient client = AgilisClient.builder().build(); // reads AGILIS_API_KEY\n\nvar result = client.categories().list();\nSystem.out.println(result.getCategories().size());"
        - "lang": "Go"
          "label": "Go"
          "source": "package main\n\nimport (\n\t\"context\"\n\t\"fmt\"\n\t\"log\"\n\n\tagilisads \"github.com/agilisdating/agilis-ads-go\"\n)\n\nfunc main() {\n\tclient := agilisads.NewClient(\"\") // reads AGILIS_API_KEY\n\tctx := context.Background()\n\n\tresult, err := client.Categories.List(ctx)\n\tif err != nil {\n\t\tlog.Fatal(err)\n\t}\n\tfmt.Println(len(result.Categories))\n}"
        - "lang": "Ruby"
          "label": "Ruby"
          "source": "require \"agilis_ads\"\n\nclient = AgilisAds::Client.new # reads AGILIS_API_KEY\n\nresult = client.categories.list\nputs result.categories.length"
