# Checks the examples without calling the API: no secrets are used.
name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No API keys committed
        run: |
          if grep -rEn 'pk_(test|live)_[A-Za-z0-9]{32}' --exclude-dir=.git .; then
            echo "A real-looking API key is committed. Remove it and roll the key in the Ad Portal."
            exit 1
          fi

      - name: JSON files parse
        run: for f in postman/*.json; do python3 -m json.tool "$f" > /dev/null || exit 1; echo "ok $f"; done

      - name: Python
        run: python3 -m py_compile examples/python/agilis_examples.py tools/build_postman.py

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Node
        run: node --check examples/node/agilis-examples.mjs

      - name: PHP
        run: php -l examples/php/agilis-examples.php

      - name: Shell
        run: |
          for f in examples/curl/*.sh; do bash -n "$f" || exit 1; echo "ok $f"; done
          shellcheck -x -S warning examples/curl/*.sh
